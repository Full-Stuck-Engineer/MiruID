name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to GHCR (defaults to false for manual smoke runs)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/miru-id

jobs:
  build-and-publish:
    name: Build, Smoke Test & Publish Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || inputs.push == true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build image for smoke verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: miru-id:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke healthcheck
        run: |
          docker run -d \
            --name miru-id-smoke \
            --read-only \
            --tmpfs /tmp:size=64m \
            -p 8000:8000 \
            -e OCR_ENABLED=false \
            miru-id:smoke

          trap 'docker logs miru-id-smoke || true; docker rm -f miru-id-smoke || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "Healthcheck passed on attempt ${attempt}"
              exit 0
            fi
            sleep 1
          done

          echo "Container failed healthcheck within 30s"
          exit 1

      - name: Build and push release image to GHCR
        if: github.event_name == 'push' || inputs.push == true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
